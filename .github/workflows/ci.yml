name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q agents api config constitutional frontend tests

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Seed harmless Docker exclusion fixtures
        run: python scripts/check_docker_context.py seed

      - name: Build API image
        run: docker build --target api --tag agentflow-api:smoke .

      - name: Verify private files are excluded from the image
        run: docker run --rm --network none --entrypoint python agentflow-api:smoke scripts/check_docker_context.py check

      - name: Smoke-test API container without credentials
        run: bash scripts/smoke_api_container.sh agentflow-api:smoke
